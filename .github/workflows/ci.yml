name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev,docs]"
      - name: Pytest
        run: pytest
      - name: BasedPyright
        run: basedpyright
      - name: MkDocs strict build
        run: mkdocs build --strict
