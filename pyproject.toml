[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "media-cover-art"
version = "0.1.0.dev0"
description = "Resolve and cache film/TV cover art from Radarr, Sonarr, and TMDB."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Steve Schleising" }]
keywords = ["cover-art", "radarr", "sonarr", "tmdb", "media"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2",
  "pymongo>=4",
  "httpx>=0.27",
]

[project.optional-dependencies]
async = ["anyio>=4"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "respx>=0.21",
  "basedpyright>=1.18",
]
docs = [
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.26",
]

[project.urls]
Homepage = "https://github.com/schleising/media-cover-art"
Documentation = "https://schleising.github.io/media-cover-art/"
Repository = "https://github.com/schleising/media-cover-art"
Issues = "https://github.com/schleising/media-cover-art/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/media_cover_art"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingImports = true
reportUnusedImport = true
